name = "taxonomy-api"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# The only public host is api.taxonomy.co.nz. Leave both false so a deploy
# does not turn the workers.dev subdomain or preview URLs back on.
workers_dev = false
preview_urls = false

# The Worker ships with no AI binding and no adjudicator flag.
# A binding plus ADJUDICATE=1 calls a model and spends money. Leave both unset
# until that spend is intended. assist=1 is a second opinion and cannot change a placement.
# RETRIEVE=1 allows Workers AI embeddings. Without it, retrieval stays off.
#
# ClaimGuard verify is rules-only unless VERIFY_MODEL=1. That flag stays unset.
# A paid model also needs an AI binding, and a valid key when VERIFY_KEYS is bound.
# Do not set VERIFY_MODEL until that spend is intended.
# [vars]
# VERIFY_MODEL = "0"
#
# [[kv_namespaces]]
# binding = "VERIFY_KEYS"
# id = "replace-with-namespace-id"
#
# [[kv_namespaces]]
# binding = "PYRAMIDS"
# id = "replace-with-namespace-id"
#
# [[r2_buckets]]
# binding = "PYRAMID_BUCKET"
# bucket_name = "taxonomy-pyramids"
#
# 60 requests a minute per IP on each of /v1/verify, /v1/classify and /v1/audit.
# The Worker keys the limiter as "{ip} {path}". A miss returns 429 with Retry-After: 60.
[[ratelimits]]
name = "VERIFY_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
