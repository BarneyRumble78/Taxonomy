name = "taxonomy-api"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Static API and the documentation page (built by scripts/build_api.py).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Optional model assist (Workers AI). Remove this block to run rules-only.
[ai]
binding = "AI"
