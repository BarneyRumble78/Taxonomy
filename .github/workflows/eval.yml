name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install pytest fastembed numpy
      - name: Rule parity, distractors, geopolitics probe
        run: python3 -m pytest -q tests
      - name: Worker abstains without calling a model
        run: node --test worker/test.mjs
